<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula sobre tabelas</title>
    <style>
        table, th, tr, td {
            border: 1px solid black;
            border-collapse: collapse;
        }

        th, td {
            text-align: center;
            padding: 5px;
        }

        table {
            width: 50%;
        }
    </style>
</head> 
<body>
    <table>
        <tr>
            <th rowspan="2">Estudante</th>
            <th colspan="2">Formação</th>
            <th rowspan="2">Ano de conclusão</th>
        </tr>
        <tr>
            <th>Graduação</th>
            <th>Pós-Graduação</th>
        </tr>
        <tr>
            <th>José</th>
            <td>Ciência da Computação</td>
            <td>Inteligência Artificial</td>
            <td>2023</td>
        </tr>
        <tr>
            <th>Ana</th>
            <td>Engenharia de Software</td>
            <td>Gestão de Projetos</td>
            <td>2022</td>
        </tr>
    </table>
</body>
</html>
